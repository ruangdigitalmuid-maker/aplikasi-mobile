<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - AbsensiSiswa</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #F8FAFC;
      color: #0F172A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      box-sizing: border-box;
    }
    .icon-box {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: #FEF3C7;
      color: #D97706;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 20px;
    }
    h1 { font-size: 20px; margin: 0 0 10px; font-weight: 700; }
    p { font-size: 14px; color: #475569; line-height: 1.6; max-width: 320px; margin: 0 0 24px; }
    button {
      background-color: #2563EB;
      color: #FFFFFF;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="icon-box">📡</div>
  <h1>Koneksi Internet Terputus</h1>
  <p>Periksa koneksi Wi-Fi atau data seluler Anda, lalu ketuk tombol di bawah untuk menyambung kembali.</p>
